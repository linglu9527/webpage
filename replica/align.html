<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封面图层对齐工具</title>
<style>
  html, body { margin: 0; height: 100%; background: #f2efe6; overflow: hidden;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #14110d; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { width: 100%; height: 100%; display: block; }

  #panel {
    position: fixed; right: 14px; top: 14px; width: 306px;
    background: rgba(16,14,12,.95); color: #e8e4da; border-radius: 12px;
    padding: 14px 16px 16px; font-size: 12px; line-height: 1.55;
    box-shadow: 0 20px 60px rgba(0,0,0,.4); z-index: 10;
    max-height: calc(100vh - 28px); overflow-y: auto;
  }
  #panel h3 { margin: 0 0 4px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #e2603a; }
  #panel .sub { opacity: .5; font-size: 11px; margin-bottom: 10px; }

  .grp { border-top: 1px solid rgba(232,228,218,.14); padding-top: 10px; margin-top: 10px; }
  .grp:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .grp__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .grp__name { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
  .grp__name b { color: #e2603a; font-weight: 600; }

  .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .row > label { width: 14px; opacity: .6; font-size: 11px; }
  .row input[type=range] { flex: 1; accent-color: #e2603a; min-width: 0; }
  .row input[type=number] {
    width: 64px; background: #0b0a08; color: #ffd9c9; border: 1px solid rgba(232,228,218,.22);
    border-radius: 5px; padding: 3px 5px; font: 11px/1.3 ui-monospace, monospace; text-align: right;
  }
  .row input[type=number]:focus { outline: 1px solid #e2603a; }

  .eye { width: 20px; height: 18px; border-radius: 4px; border: 1px solid rgba(232,228,218,.3);
    background: transparent; color: #e8e4da; font-size: 9px; line-height: 1; cursor: pointer; padding: 0; }
  .eye.off { opacity: .32; }

  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button.act {
    flex: 1; min-width: 84px; cursor: pointer; border: 1px solid rgba(232,228,218,.25);
    background: transparent; color: #e8e4da; border-radius: 6px; padding: 8px; font-size: 11px; letter-spacing: .08em;
  }
  button.act:hover { background: rgba(232,228,218,.1); }
  button.act.primary { background: #e2603a; border-color: #e2603a; color: #14110d; font-weight: 600; }

  .step { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 11px; opacity: .8; }
  .step input { width: 74px; background: #0b0a08; color: #ffd9c9; border: 1px solid rgba(232,228,218,.22);
    border-radius: 5px; padding: 3px 5px; font: 11px ui-monospace, monospace; }

  #out { width: 100%; height: 64px; margin-top: 10px; background: #0b0a08; color: #9fe6c4;
    border: 1px solid rgba(232,228,218,.16); border-radius: 6px;
    font: 10.5px/1.5 ui-monospace, monospace; padding: 8px; resize: vertical; box-sizing: border-box; }
  .hint { opacity: .5; font-size: 10.5px; margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
<div id="stage"><canvas></canvas></div>

<div id="panel">
  <h3>图层对齐</h3>
  <div class="sub">拖动或直接输入数值，自动保存，主页刷新即生效</div>

  <div class="grp">
    <div class="grp__head">
      <span class="grp__name"><b>02</b> 头盔彩图</span>
      <button class="eye" data-eye="helmet" title="显示/隐藏">👁</button>
    </div>
    <div class="row"><label>W</label><input type="range" id="hw" min="0.05" max="0.8" step="0.001"><input type="number" id="hwn" step="0.001"></div>
    <div class="row"><label>X</label><input type="range" id="hx" min="-0.5" max="0.5" step="0.001"><input type="number" id="hxn" step="0.001"></div>
    <div class="row"><label>Y</label><input type="range" id="hy" min="-0.6" max="0.6" step="0.001"><input type="number" id="hyn" step="0.001"></div>
    <div class="row"><label>α</label><input type="range" id="ho" min="0" max="1" step="0.01"><input type="number" id="hon" step="0.01"></div>
  </div>

  <div class="grp">
    <div class="grp__head">
      <span class="grp__name"><b>03</b> 线框</span>
      <button class="eye" data-eye="wire" title="显示/隐藏">👁</button>
    </div>
    <div class="row"><label>W</label><input type="range" id="ww" min="0.05" max="0.8" step="0.001"><input type="number" id="wwn" step="0.001"></div>
    <div class="row"><label>X</label><input type="range" id="wx" min="-0.5" max="0.5" step="0.001"><input type="number" id="wxn" step="0.001"></div>
    <div class="row"><label>Y</label><input type="range" id="wy" min="-0.6" max="0.6" step="0.001"><input type="number" id="wyn" step="0.001"></div>
    <div class="row"><label>α</label><input type="range" id="wo" min="0" max="1" step="0.01"><input type="number" id="won" step="0.01"></div>
  </div>

  <div class="grp">
    <div class="grp__head">
      <span class="grp__name"><b>01</b> 底图</span>
      <button class="eye" data-eye="base" title="显示/隐藏">👁</button>
    </div>
    <div class="row"><label>W</label><input type="range" id="bw" min="0.2" max="1.2" step="0.001"><input type="number" id="bwn" step="0.001"></div>
    <div class="row"><label>X</label><input type="range" id="bx" min="-0.5" max="0.5" step="0.001"><input type="number" id="bxn" step="0.001"></div>
    <div class="row"><label>Y</label><input type="range" id="by" min="-0.5" max="0.5" step="0.001"><input type="number" id="byn" step="0.001"></div>
  </div>

  <div class="step">
    方向键步长 <input type="number" id="step" value="0.002" step="0.001">
  </div>

  <div class="btns">
    <button class="act" id="sync">线框=头盔</button>
    <button class="act" id="reset">重置</button>
  </div>
  <div class="btns">
    <button class="act" id="solo">只留头盔</button>
    <button class="act primary" id="apply">保存并应用</button>
  </div>

  <textarea id="out" readonly></textarea>
  <div class="hint">
    方向键移动头盔层（Shift 更细）<br>
    点数字框可直接输入精确值
  </div>
</div>

<script type="module">
import { HERO } from './js/config.js';
import { createHeroCanvas } from './js/hero-canvas.js';

const DEFAULTS = {
  base: { w: 0.62, x: 0, y: -0.072 },
  helmet: { w: 0.341, x: 0, y: -0.1376 },
  wire: { w: 0.341, x: 0, y: -0.1376 },
};

let assets = {
  base: 'assets/portrait.png',
  helmet: 'assets/helmet-doge.png',
  wire: 'assets/helmet-wire.png',
};

try {
  const t = await (await fetch('theme.json', { cache: 'no-store' })).json();
  if (t?.ASSETS?.hero) assets = { ...assets, ...t.ASSETS.hero };
  if (t?.HERO?.layout) {
    for (const k of ['base', 'helmet', 'wire']) {
      if (t.HERO.layout[k]) Object.assign(HERO.layout[k], t.HERO.layout[k]);
    }
  }
} catch {}

try {
  const saved = JSON.parse(localStorage.getItem('heroLayout') || 'null');
  if (saved) {
    for (const k of ['base', 'helmet', 'wire']) {
      if (saved[k]) Object.assign(HERO.layout[k], saved[k]);
    }
  }
} catch {}

// 对齐时三层全显
HERO.reveal.min = 1.0;
HERO.reveal.max = 1.0;
HERO.opacity = { base: 1, helmet: 1, wire: 1 };

const canvas = document.querySelector('#stage canvas');
const hero = await createHeroCanvas(canvas, HERO, assets);
hero.setPointer(0.5, 0.5, true, true);

const $ = (id) => document.getElementById(id);
const L = HERO.layout;

const FIELDS = [
  ['hw', 'hwn', 'helmet', 'w'],
  ['hx', 'hxn', 'helmet', 'x'],
  ['hy', 'hyn', 'helmet', 'y'],
  ['ww', 'wwn', 'wire', 'w'],
  ['wx', 'wxn', 'wire', 'x'],
  ['wy', 'wyn', 'wire', 'y'],
  ['bw', 'bwn', 'base', 'w'],
  ['bx', 'bxn', 'base', 'x'],
  ['by', 'byn', 'base', 'y'],
];

const OPACITY = [['ho', 'hon', 'helmet'], ['wo', 'won', 'wire']];

let soloOn = false;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round = (n) => Math.round((n + Number.EPSILON) * 10000) / 10000;

function writeOut() {
  $('out').value = JSON.stringify({
    base: { w: round(L.base.w), x: round(L.base.x || 0), y: round(L.base.y) },
    helmet: { w: round(L.helmet.w), x: round(L.helmet.x || 0), y: round(L.helmet.y) },
    wire: { w: round(L.wire.w), x: round(L.wire.x || 0), y: round(L.wire.y) },
  }, null, 0);
}

function paint() {
  for (const [rid, nid, layer, key] of FIELDS) {
    const v = L[layer][key] ?? 0;
    $(rid).value = v;
    $(nid).value = (+v).toFixed(key === 'w' ? 3 : 4);
  }
  for (const [rid, nid, layer] of OPACITY) {
    const v = HERO.opacity[layer] ?? 1;
    $(rid).value = v;
    $(nid).value = (+v).toFixed(2);
  }
  writeOut();
}

function save() {
  localStorage.setItem('heroLayout', JSON.stringify({
    base: { w: L.base.w, x: L.base.x || 0, y: L.base.y },
    helmet: { w: L.helmet.w, x: L.helmet.x || 0, y: L.helmet.y },
    wire: { w: L.wire.w, x: L.wire.x || 0, y: L.wire.y },
  }));
}

function commit() {
  hero.render();
  writeOut();
  clearTimeout(commit._t);
  commit._t = setTimeout(save, 250);
}

for (const [rid, nid, layer, key] of FIELDS) {
  const apply = (val) => {
    const v = clamp(parseFloat(val) || 0, -2, 2);
    L[layer][key] = v;
    $(rid).value = v;
    $(nid).value = (+v).toFixed(key === 'w' ? 3 : 4);
    commit();
  };
  $(rid).addEventListener('input', (e) => apply(e.target.value));
  $(nid).addEventListener('change', (e) => apply(e.target.value));
}

for (const [rid, nid, layer] of OPACITY) {
  const apply = (val) => {
    const v = clamp(parseFloat(val) || 0, 0, 1);
    HERO.opacity[layer] = v;
    $(rid).value = v;
    $(nid).value = v.toFixed(2);
    commit();
  };
  $(rid).addEventListener('input', (e) => apply(e.target.value));
  $(nid).addEventListener('change', (e) => apply(e.target.value));
}

document.querySelectorAll('[data-eye]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const layer = btn.dataset.eye;
    const on = HERO.opacity[layer] > 0.001;
    HERO.opacity[layer] = on ? 0 : 1;
    btn.classList.toggle('off', on);
    paint();
    commit();
  });
});

$('sync').addEventListener('click', () => {
  L.wire.w = L.helmet.w;
  L.wire.x = L.helmet.x || 0;
  L.wire.y = L.helmet.y;
  paint();
  commit();
});

$('solo').addEventListener('click', () => {
  soloOn = !soloOn;
  if (soloOn) {
    HERO.opacity.base = 1;
    HERO.opacity.wire = 0;
    HERO.opacity.helmet = 0.55;
    $('solo').textContent = '恢复全部';
  } else {
    HERO.opacity = { base: 1, helmet: 1, wire: 1 };
    $('solo').textContent = '只留头盔';
  }
  paint();
  commit();
});

$('reset').addEventListener('click', () => {
  localStorage.removeItem('heroLayout');
  for (const k of ['base', 'helmet', 'wire']) {
    Object.assign(L[k], DEFAULTS[k]);
  }
  HERO.opacity = { base: 1, helmet: 1, wire: 1 };
  paint();
  commit();
});

$('apply').addEventListener('click', () => {
  save();
  const btn = $('apply');
  const old = btn.textContent;
  btn.textContent = '已保存 ✓';
  setTimeout(() => { btn.textContent = old; }, 1400);
});

window.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const base = parseFloat($('step').value) || 0.002;
  const step = e.shiftKey ? base / 4 : base;
  const map = {
    ArrowLeft: ['x', -step],
    ArrowRight: ['x', step],
    ArrowUp: ['y', step],
    ArrowDown: ['y', -step],
  };
  const hit = map[e.key];
  if (!hit) return;
  e.preventDefault();
  L.helmet[hit[0]] = (L.helmet[hit[0]] || 0) + hit[1];
  paint();
  commit();
});

paint();
hero.render();
</script>
</body>
</html>
