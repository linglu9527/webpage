<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封面图层对齐工具</title>
<style>
  html, body { margin: 0; height: 100%; background: #f2efe6; overflow: hidden;
    font-family: Inter, system-ui, sans-serif; color: #14110d; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { width: 100%; height: 100%; display: block; }

  #panel {
    position: fixed; right: 16px; top: 16px; width: 292px;
    background: rgba(16,14,12,.94); color: #e8e4da; border-radius: 10px;
    padding: 14px 16px; font-size: 12px; line-height: 1.6;
    box-shadow: 0 18px 50px rgba(0,0,0,.35); z-index: 10;
    max-height: calc(100vh - 32px); overflow: auto;
  }
  #panel h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #b23a1f; }
  .grp { border-top: 1px solid rgba(232,228,218,.16); padding-top: 10px; margin-top: 10px; }
  .grp:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row label { width: 22px; opacity: .65; }
  .row input[type=range] { flex: 1; accent-color: #b23a1f; }
  .row output { width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    flex: 1; min-width: 88px; cursor: pointer; border: 1px solid rgba(232,228,218,.25);
    background: transparent; color: #e8e4da; border-radius: 6px; padding: 7px 8px;
    font-size: 11px; letter-spacing: .08em;
  }
  button:hover { background: rgba(232,228,218,.1); }
  button.primary { background: #b23a1f; border-color: #b23a1f; }
  #out { width: 100%; height: 72px; margin-top: 10px; background: #0b0a08; color: #8fd; border: 1px solid rgba(232,228,218,.16);
    border-radius: 6px; font: 11px/1.5 ui-monospace, monospace; padding: 8px; resize: vertical; }
  .hint { opacity: .55; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<div id="stage"><canvas></canvas></div>

<div id="panel">
  <h3>图层对齐</h3>

  <div class="grp">
    <div class="row"><label>W</label><input type="range" id="hw" min="0.05" max="0.8" step="0.002"><output id="hwo"></output></div>
    <div class="row"><label>X</label><input type="range" id="hx" min="-0.7" max="0.7" step="0.002"><output id="hxo"></output></div>
    <div class="row"><label>Y</label><input type="range" id="hy" min="-0.9" max="0.9" step="0.002"><output id="hyo"></output></div>
    <div class="hint">↑ 头盔彩图（图二）</div>
  </div>

  <div class="grp">
    <div class="row"><label>W</label><input type="range" id="ww" min="0.05" max="0.8" step="0.002"><output id="wwo"></output></div>
    <div class="row"><label>X</label><input type="range" id="wx" min="-0.7" max="0.7" step="0.002"><output id="wxo"></output></div>
    <div class="row"><label>Y</label><input type="range" id="wy" min="-0.9" max="0.9" step="0.002"><output id="wyo"></output></div>
    <div class="hint">↑ 线框图（图三）</div>
  </div>

  <div class="grp">
    <div class="row"><label>B</label><input type="range" id="bw" min="0.2" max="1.2" step="0.002"><output id="bwo"></output></div>
    <div class="row"><label>Y</label><input type="range" id="by" min="-0.9" max="0.9" step="0.002"><output id="byo"></output></div>
    <div class="hint">↑ 底图（图一）</div>
  </div>

  <div class="grp">
    <div class="row"><label>α</label><input type="range" id="ho" min="0" max="1" step="0.01"><output id="hoo"></output></div>
    <div class="hint">↑ 头盔图透明度（调低可看穿到狗眼）</div>
    <div class="row"><label>α</label><input type="range" id="wo" min="0" max="1" step="0.01"><output id="woo"></output></div>
    <div class="hint">↑ 线框图透明度</div>
  </div>

  <div class="btns">
    <button id="sync">线框=头盔</button>
    <button id="toggleHelmet">隐藏/显示头盔图</button>
  </div>
  <div class="btns">
    <button id="reset">重置</button>
    <button class="primary" id="apply">应用到主页</button>
  </div>

  <textarea id="out" readonly></textarea>
  <div class="hint">键盘 ← → ↑ ↓ 微调（按住 Shift 更细）；点击画面后可用方向键。</div>
</div>

<script type="module">
import { HERO } from './js/config.js';
import { createHeroCanvas } from './js/hero-canvas.js';

// 读主题里的素材路径
let assets = { base: 'assets/portrait.png', helmet: 'assets/helmet-doge.png', wire: 'assets/helmet-wire.png' };
try {
  const t = await (await fetch('theme.json', { cache: 'no-store' })).json();
  if (t?.ASSETS?.hero) assets = { ...assets, ...t.ASSETS.hero };
  if (t?.HERO?.layout) Object.assign(HERO.layout, JSON.parse(JSON.stringify(t.HERO.layout)));
} catch {}

// 存档优先
try {
  const saved = JSON.parse(localStorage.getItem('heroLayout') || 'null');
  if (saved) Object.assign(HERO.layout, saved);
} catch {}

// 显现全开，方便看边界
HERO.reveal.min = 1.0;
HERO.reveal.max = 1.0;

const canvas = document.querySelector('#stage canvas');
const hero = await createHeroCanvas(canvas, HERO, assets);
hero.setPointer(0.5, 0.5, true, true);

const $ = (id) => document.getElementById(id);
const S = {
  hw: $('hw'), hx: $('hx'), hy: $('hy'),
  ww: $('ww'), wx: $('wx'), wy: $('wy'),
  bw: $('bw'), by: $('by')
};

let showHelmet = true;
HERO.opacity = { helmet: 1, wire: 1, base: 1 };

function paintPanel() {
  const l = HERO.layout;
  S.hw.value = l.helmet.w; $('hwo').textContent = (+l.helmet.w).toFixed(3);
  S.hx.value = l.helmet.x ?? 0; $('hxo').textContent = (+(l.helmet.x ?? 0)).toFixed(3);
  S.hy.value = l.helmet.y; $('hyo').textContent = (+l.helmet.y).toFixed(3);
  S.ww.value = l.wire.w; $('wwo').textContent = (+l.wire.w).toFixed(3);
  S.wx.value = l.wire.x ?? 0; $('wxo').textContent = (+(l.wire.x ?? 0)).toFixed(3);
  S.wy.value = l.wire.y; $('wyo').textContent = (+l.wire.y).toFixed(3);
  S.bw.value = l.base.w; $('bwo').textContent = (+l.base.w).toFixed(3);
  S.by.value = l.base.y; $('byo').textContent = (+l.base.y).toFixed(3);

  $('ho').value = HERO.opacity.helmet; $('hoo').textContent = (+HERO.opacity.helmet).toFixed(2);
  $('wo').value = HERO.opacity.wire; $('woo').textContent = (+HERO.opacity.wire).toFixed(2);

  $('out').value = JSON.stringify({
    base: { w: +l.base.w.toFixed(3), y: +l.base.y.toFixed(3) },
    helmet: { w: +l.helmet.w.toFixed(3), x: +(l.helmet.x ?? 0).toFixed(3), y: +l.helmet.y.toFixed(3) },
    wire: { w: +l.wire.w.toFixed(3), x: +(l.wire.x ?? 0).toFixed(3), y: +l.wire.y.toFixed(3) }
  }, null, 2);
}

function apply() {
  HERO.layout.helmet.w = +S.hw.value;
  HERO.layout.helmet.x = +S.hx.value;
  HERO.layout.helmet.y = +S.hy.value;
  HERO.layout.wire.w = +S.ww.value;
  HERO.layout.wire.x = +S.wx.value;
  HERO.layout.wire.y = +S.wy.value;
  HERO.layout.base.w = +S.bw.value;
  HERO.layout.base.y = +S.by.value;
  paintPanel();
  hero.render();
}

Object.values(S).forEach((el) => el.addEventListener('input', apply));

$('ho').addEventListener('input', (e) => {
  HERO.opacity.helmet = +e.target.value;
  $('hoo').textContent = (+e.target.value).toFixed(2);
  hero.render();
});
$('wo').addEventListener('input', (e) => {
  HERO.opacity.wire = +e.target.value;
  $('woo').textContent = (+e.target.value).toFixed(2);
  hero.render();
});

$('sync').addEventListener('click', () => {
  S.ww.value = S.hw.value; S.wx.value = S.hx.value; S.wy.value = S.hy.value;
  apply();
});

$('toggleHelmet').addEventListener('click', () => {
  showHelmet = !showHelmet;
  HERO.layout.helmet.w = showHelmet ? +S.hw.value : 0.0001;
  paintPanel();
  hero.render();
});

$('reset').addEventListener('click', () => {
  localStorage.removeItem('heroLayout');
  Object.assign(HERO.layout, {
    base: { w: 0.62, y: -0.10 },
    helmet: { w: 0.341, x: 0, y: -0.191 },
    wire: { w: 0.341, x: 0, y: -0.191 }
  });
  paintPanel();
  hero.render();
});

$('apply').addEventListener('click', () => {
  localStorage.setItem('heroLayout', JSON.stringify(HERO.layout));
  $('apply').textContent = '已保存 ✓';
  setTimeout(() => ($('apply').textContent = '应用到主页'), 1600);
});

// 方向键微调
window.addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 0.001 : 0.004;
  const map = { ArrowLeft: ['hx', -step], ArrowRight: ['hx', step], ArrowUp: ['hy', step], ArrowDown: ['hy', -step] };
  const hit = map[e.key];
  if (!hit) return;
  const el = S[hit[0]];
  el.value = (+el.value + hit[1]).toFixed(3);
  apply();
  e.preventDefault();
});

paintPanel();
hero.render();
</script>
</body>
</html>
