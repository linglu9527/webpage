<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REA Replica — 滚动流程复刻</title>
<meta name="description" content="landonorris.com 滚动结构与动效的工程复刻">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Noto+Sans+SC:wght@700&display=swap">
<link rel="stylesheet" href="css/main.css">
</head>
<body data-theme="lime">

<!-- 导航暂时隐藏（跳转链接本轮不需要） -->

<main>

  <!-- ========================= 1. 首屏 ========================= -->
  <div class="hero-track" data-sticky-hero data-section="hero">
    <section class="hero" data-section="hero" data-section-theme="white">
      <!-- 单画布合成：底=刀盾狗 / 中=头盔完整图(鼠标附近显现) / 顶=头盔线框(常显+描边光) -->
      <div class="hero__canvas" data-hero-canvas><canvas></canvas></div>

      <!-- 顶部标题 -->
      <h1 class="hero__title" data-content="hero.title">WO DE DAO DUN</h1>

      <!-- 四角文案 -->
      <div class="hero__corner hero__corner--tl" data-content="hero.tl">NIUYANTAO</div>
      <button class="hero__corner hero__corner--tr hero__corner--btn" data-content="hero.tr" data-bark type="button" aria-label="大狗叫一声">大狗</button>
      <button class="hero__corner hero__corner--bl hero__corner--pet" data-pet type="button" aria-label="大狗大狗"><span class="pet__box"><img class="pet__img" src="assets/dog-a.jpg" alt="" data-src-rest="assets/dog-a.jpg" data-src-bark="assets/dog-b.jpg"><span class="pet__label" data-pet-label>大狗大狗</span></span></button>
      <span class="hero__corner hero__corner--br" data-content="hero.br">VIEW ON TRACK</span>
    </section>
  </div>

  <!-- ========================= 2. 跑马灯 ========================= -->
  <section class="marquee" data-section="marquee" data-section-theme="dark">
    <div class="marquee__row" data-marquee-scroll="0.12" data-marquee-text="WE DID IT AT HOME">WE DID IT AT HOME</div>
    <div class="marquee__row" data-marquee-scroll="0.2" data-marquee-text="A BRITISH GP WEEKEND">A BRITISH GP WEEKEND</div>
  </section>

  <!-- ========================= 3. 横向赛道 ========================= -->
  <section class="h-section" data-section="track" data-horizontal-section data-section-theme="dark">
    <div class="h-sticky">
        <div class="h-head">
          <h2 class="h2" data-content="track.title">ON TRACK</h2>
          <div class="h-head__meta">
            <span>04 RACE WEEKENDS</span>
            <span>SCROLL →</span>
          </div>
        </div>
      <div class="h-track" data-horizontal-track data-list="trackPanels"></div>
    </div>
  </section>

  <!-- ========================= 4. On / Off track ========================= -->
  <section class="section otot" data-section="otot" data-section-theme="white">
    <div class="otot__card" data-reveal>
      <div class="eyebrow" style="color:inherit;opacity:.6">01</div>
      <h3 data-content="otot.onLabel">ON TRACK</h3>
      <p data-content="otot.onText">Live results…</p>
      <a class="hero__cta" style="margin-top:26px" href="on-track.html" data-link="onTrack">OPEN →</a>
      <div class="otot__art" data-art="on-track"></div>
    </div>
    <div class="otot__card" data-reveal style="background:transparent;color:var(--fg);border:1px solid var(--line)">
      <div class="eyebrow" style="opacity:.6">02</div>
      <h3 data-content="otot.offLabel">OFF TRACK</h3>
      <p data-content="otot.offText">Padel…</p>
      <a class="hero__cta" style="margin-top:26px;background:var(--fg);color:var(--bg)" href="off-track.html" data-link="offTrack">OPEN →</a>
    </div>
  </section>

  <!-- ========================= 5. 头盔 ========================= -->
  <section class="section" data-section="helmets" data-section-theme="white">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(24px,4vw,54px)">
      <h2 class="h2" data-content="helmets.title" data-reveal>HELMETS</h2>
      <div class="body-sm" style="max-width:34ch" data-reveal>两款配色共用同一套 PBR 贴图，仅换 BaseColor 与 matcap。</div>
    </div>
    <div class="cards" data-list="helmets"></div>
  </section>

  <!-- ========================= 6. LANDO EXE ========================= -->
  <section class="section" data-section="exe" data-section-theme="dark">
    <div class="grid-2" style="align-items:center">
      <div>
        <div class="eyebrow" data-content="exe.label" data-reveal>LANDO EXE</div>
        <h2 class="h2" data-content="exe.title" data-reveal style="margin:18px 0">Always bringing the fight.</h2>
        <p class="body-sm" data-content="exe.text" data-reveal></p>
      </div>
      <div style="aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--radius);display:grid;place-items:center;overflow:hidden" data-parallax="0.12">
        <div class="exe__art" data-art="exe"></div>
      </div>
    </div>
  </section>

  <!-- ========================= 7. 联名 ========================= -->
  <section class="section" data-section="collabs" data-section-theme="white">
    <h2 class="h2" data-content="collabs.title" data-reveal style="margin-bottom:clamp(24px,4vw,48px)">COLLABS</h2>
    <div class="list" data-list="collabs"></div>
  </section>

  <!-- ========================= 8. 社媒 ========================= -->
  <section class="section" data-section="socials" data-section-theme="dark">
    <h2 class="h2" data-content="socials.title" data-reveal style="margin-bottom:clamp(24px,4vw,48px)">SOCIALS</h2>
    <div class="socials" data-list="socials"></div>
  </section>

</main>

<!-- ========================= 9. 页脚 ========================= -->
<footer class="footer" data-section="footer" data-section-theme="paper">
  <h2 class="footer__big" data-content="footer.big" data-reveal>LN4</h2>
  <div class="footer__meta">
    <div data-content="footer.note"></div>
    <nav class="footer__links" data-list="footerLinks"></nav>
  </div>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
